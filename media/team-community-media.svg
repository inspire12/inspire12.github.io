<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 395" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">팀 응원 커뮤니티 · 미디어 처리</title>
  <desc id="desc">팬이 파일을 올린 후, 이미지와 영상은 비동기 처리 단계에서 각각 크기 조정과 영상 변환을 거칩니다. 크기를 조정한 이미지는 팀 게시글 피드와 이미지 모아보기에서 사용합니다.</desc>
