    <style>text{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.edge{fill:none;stroke:#54718b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect x="1" y="1" width="478" height="458" rx="16" fill="#f8fafc" stroke="#d7e0ea" stroke-width="1.2" />
  <rect x="66" y="24" width="348" height="71" rx="10" fill="#ffffff" stroke="#c6d3e0" stroke-width="1.2" />
  <g transform="translate(88 48)" stroke="#45617d" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M6 17.5H5a4.5 4.5 0 0 1-.4-9 7 7 0 0 1 13.2-1A5.1 5.1 0 0 1 19 17.5h-1.5"/><path d="M12 21V11m-4 4 4-4 4 4"/></g>
