<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" role="img" aria-labelledby="diagram-title diagram-desc" xml:lang="ko">
  <title id="diagram-title">커뮤니티 미디어 업로드와 비동기 처리</title>
  <desc id="diagram-desc">팬이 올린 파일을 비동기로 처리합니다. 이미지 크기를 조정한 결과는 팀 게시글 피드와 이미지 모아보기에서 사용합니다. 영상은 별도로 변환합니다.</desc>
