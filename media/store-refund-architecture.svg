<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">두 스토어의 환불 알림을 처리하는 경로</title>
  <desc id="desc">Apple App Store는 서명된 REFUND 알림을 보내고 Google Play는 RTDN을 Cloud Pub/Sub로 전달합니다. 두 스토어의 알림은 AWS API Gateway에서 지정한 경로를 거쳐 썸원 앱 서버의 환불 처리로 이어집니다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", sans-serif; fill: #162c46; }
    .label { font-size: 22px; font-weight: 700; }
    .sub { font-size: 18px; fill: #42566b; }
    .small { font-size: 17px; fill: #42566b; }
    .blue { fill: #245994; }
    .teal { fill: #17645d; }
    .warm { fill: #845823; }
    .wire { fill: none; stroke: #647b91; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1l5.7 3L1 7" fill="none" stroke="#647b91" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="478" height="438" rx="16" fill="#f8fafc" stroke="#d7e0ea"/>
  <rect x="18" y="24" width="211" height="128" rx="12" fill="#ffffff" stroke="#cad6e2" stroke-width="1.3"/>
  <rect x="251" y="24" width="211" height="128" rx="12" fill="#ffffff" stroke="#cad6e2" stroke-width="1.3"/>
  <text x="123.5" y="60" class="label" text-anchor="middle">Apple App Store</text>
  <text x="356.5" y="60" class="label" text-anchor="middle">Google Play</text>
  <path d="M37 76h173m60 0h173" stroke="#d7e0ea"/>
  <text x="123.5" y="103" class="sub blue" text-anchor="middle">REFUND 알림</text>
  <text x="123.5" y="130" class="small" text-anchor="middle">서명된 signedPayload</text>
  <text x="356.5" y="103" class="sub blue" text-anchor="middle">RTDN</text>
  <text x="356.5" y="130" class="small" text-anchor="middle">Cloud Pub/Sub</text>
  <path class="wire" d="M123 152v24q0 6 6 6h222q6 0 6-6v-24"/>
  <path class="wire" d="M240 182v31" marker-end="url(#arrow)"/>
  <rect x="30" y="217" width="420" height="82" rx="12" fill="#e8f1fb" stroke="#adc7e4" stroke-width="1.3"/>
  <g aria-hidden="true" transform="translate(50 243.0) scale(1.2500)" stroke="#245994" color="#245994" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h9m-4-3 4 3-4 3M3 18h9m-4-3 4 3-4 3M16 3h5v18h-5"/></g>
  <text x="98" y="257.0" class="label" text-anchor="start">AWS API Gateway</text>
  <text x="98" y="283.0" class="sub" text-anchor="start">환불 알림 수신 경로</text>
  <path class="wire" d="M240 299v31" marker-end="url(#arrow)"/>
  <rect x="30" y="334" width="420" height="82" rx="12" fill="#e6f4f0" stroke="#a9cfc4" stroke-width="1.3"/>
  <g aria-hidden="true" transform="translate(50 360.0) scale(1.2500)" stroke="#17645d" color="#17645d" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h1m-1 10h1m4-10h5m-5 10h5"/></g>
  <text x="98" y="374.0" class="label" text-anchor="start">썸원 앱 서버</text>
  <text x="98" y="400.0" class="sub" text-anchor="start">스토어 환불을 거래에 반영</text>
</svg>
