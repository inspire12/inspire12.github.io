<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 564" role="img" aria-labelledby="diagram-title diagram-desc" xml:lang="ko">
  <title id="diagram-title">썸원타임 문구 파일 조회와 발송</title>
  <desc id="diagram-desc">Hackle로 사용자에게 문구 파일을 배정한 후 캐시를 조회합니다. 캐시 적중 시 파일을 재사용합니다. 캐시 미스 시 Amazon S3에서 파일을 읽어 캐시에 저장합니다. 두 경로 모두 선택한 파일의 문구로 질문 알림을 보냅니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 0.8 7.2 4 1 7.2" fill="none" stroke="#54718b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.edge{fill:none;stroke:#54718b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect x="1" y="1" width="478" height="562" rx="16" fill="#f8fafc" stroke="#d7e0ea" stroke-width="1.2" />
  <rect x="69" y="27" width="342" height="74" rx="10" fill="#ffffff" stroke="#c6d3e0" stroke-width="1.2" />
  <g transform="translate(91 49)" stroke="#45617d" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M5 21V3m1 1c5-4 7 4 14 0v9c-7 4-9-4-14 0"/></g>
  <text x="133" y="58" font-size="22" font-weight="700" fill="#162c46" text-anchor="start">Hackle</text>
  <text x="133" y="82" font-size="17" font-weight="450" fill="#435a70" text-anchor="start">사용자별 문구 파일 배정</text>
  <path class="edge" d="M240 102v32" marker-end="url(#arrow)"/>
  <rect x="69" y="138" width="342" height="69" rx="10" fill="#e8f1fb" stroke="#a5bfd9" stroke-width="1.2" />
  <g transform="translate(91 161)" stroke="#245994" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></g>
  <text x="133" y="180" font-size="20" font-weight="650" fill="#162c46" text-anchor="start">배정된 파일의 캐시 조회</text>
  <path class="edge" d="M240 208v20H123v42" marker-end="url(#arrow)"/>
  <path class="edge" d="M240 228h117v42" marker-end="url(#arrow)"/>
  <rect x="75" y="242" width="96" height="23" rx="5" fill="#f8fafc" stroke="none" stroke-width="1.2" />
  <text x="123" y="259" font-size="17" font-weight="650" fill="#245994" text-anchor="middle">캐시 적중</text>
  <rect x="308" y="242" width="98" height="23" rx="5" fill="#f8fafc" stroke="none" stroke-width="1.2" />
  <text x="357" y="259" font-size="17" font-weight="650" fill="#845823" text-anchor="middle">캐시 미스</text>
  <rect x="24" y="275" width="198" height="74" rx="10" fill="#ffffff" stroke="#c6d3e0" stroke-width="1.2" />
  <text x="123" y="319" font-size="20" font-weight="650" fill="#162c46" text-anchor="middle">문구 파일 재사용</text>
  <rect x="258" y="275" width="198" height="74" rx="10" fill="#fcf2df" stroke="#dac79d" stroke-width="1.2" />
  <text x="357" y="306" font-size="21" font-weight="700" fill="#664519" text-anchor="middle">Amazon S3</text>
  <text x="357" y="331" font-size="17" font-weight="450" fill="#70542f" text-anchor="middle">문구 파일 읽기</text>
  <path class="edge" d="M357 350v20" marker-end="url(#arrow)"/>
  <rect x="258" y="374" width="198" height="53" rx="10" fill="#e8f1fb" stroke="#a5bfd9" stroke-width="1.2" />
  <text x="357" y="407" font-size="20" font-weight="650" fill="#162c46" text-anchor="middle">캐시에 저장</text>
  <path class="edge" d="M123 350v99h117"/>
  <path class="edge" d="M357 428v21H240v22" marker-end="url(#arrow)"/>
  <rect x="69" y="475" width="342" height="63" rx="10" fill="#e6f4f0" stroke="#a0c7bc" stroke-width="1.2" />
  <g transform="translate(93 495)" stroke="#17645d" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M4 17c3-3 3-5 3-8a5 5 0 0 1 10 0c0 3 0 5 3 8zM10 20a2.5 2.5 0 0 0 4 0"/></g>
  <text x="133" y="514" font-size="20" font-weight="650" fill="#164d48" text-anchor="start">선택한 문구로 알림 발송</text>
</svg>
