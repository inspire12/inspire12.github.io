<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 555" role="img" aria-labelledby="title description" xml:lang="ko">
  <title id="title">PAIGE의 추천 생성과 홈 피드 조회</title>
  <desc id="description">PAIGE의 여러 서비스가 보낸 데이터를 culogger에서 모아 포맷을 통일합니다. AI 팀의 Curation Platform이 생성한 추천 결과로 배치가 팀별 피드 캐시를 갱신합니다. 홈 피드는 응원 팀에 해당하는 캐시를 조회합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#526e88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text {font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif}
      .node {font-size:21px;font-weight:680}
      .sub {font-size:17px;font-weight:450;fill:#405974}
      .stage {font-size:17px;font-weight:680;fill:#245994}
      .verb {font-size:16px;font-weight:550;fill:#405974}
      .wire {fill:none;stroke:#526e88;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect x="1" y="1" width="478" height="553" rx="16" fill="#f8fafc" stroke="#d7e0ea" stroke-width="1.5"/>
  <text x="24" y="39" class="stage" text-anchor="start">추천 데이터 수집과 생성</text>
  <path d="M226 33H456" stroke="#d7e0ea" stroke-width="1.3"/>
  <rect x="45" y="59" width="390" height="52" rx="10" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.4"/>
  <text x="240" y="92" class="node" text-anchor="middle" fill="#162c46">PAIGE 서비스들</text>
  <path d="M240 112V136" class="wire" marker-end="url(#arrow)"/>
  <rect x="45" y="139" width="390" height="71" rx="10" fill="#e8f1fb" stroke="#a6c3de" stroke-width="1.4"/>
  <text x="240" y="170.5" class="node" text-anchor="middle" fill="#234f80">culogger</text>
  <text x="240" y="195.5" class="sub" text-anchor="middle">여러 서비스의 데이터를 모아 형식 통일</text>
  <path d="M240 211V235" class="wire" marker-end="url(#arrow)"/>
  <rect x="45" y="238" width="390" height="72" rx="10" fill="#e8f1fb" stroke="#a6c3de" stroke-width="1.4"/>
  <text x="240" y="270" class="node" text-anchor="middle" fill="#234f80">Curation Platform</text>
  <text x="240" y="295" class="sub" text-anchor="middle">AI 팀에서 추천 결과 생성</text>
  <path d="M240 311V366" class="wire" marker-end="url(#arrow)"/>
  <text x="254" y="345" class="verb" text-anchor="start">배치로 피드 갱신</text>
  <rect x="45" y="369" width="390" height="73" rx="10" fill="#e6f4f0" stroke="#a3cbc0" stroke-width="1.4"/>
  <text x="240" y="401.5" class="node" text-anchor="middle" fill="#155d56">응원 팀별 피드 캐시</text>
  <text x="240" y="426.5" class="sub" text-anchor="middle">같은 팀 팬에게 제공할 추천 결과 보관</text>
  <path d="M240 492V446" class="wire" marker-end="url(#arrow)"/>
  <text x="254" y="475" class="verb" text-anchor="start">응원 팀으로 조회</text>
  <rect x="45" y="495" width="390" height="42" rx="10" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.4"/>
  <text x="240" y="523" class="node" text-anchor="middle" fill="#162c46">사용자 홈 피드</text>
</svg>
