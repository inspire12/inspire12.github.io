<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 530" role="img" aria-labelledby="title description" xml:lang="ko">
  <title id="title">썸원 질문 등록 전 검수와 등록 후 평가</title>
  <desc id="description">등록 전에는 새 질문과 기존 질문을 임베딩으로 비교해 편집자가 유사 후보를 검수합니다. 등록 후에는 질문에 의미와 의도를 태깅해 그래프로 묶고 그룹별 실사용자 응답률을 비교합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#526e88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text {font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif}
      .node {font-size:21px;font-weight:680}
      .sub {font-size:17px;font-weight:450;fill:#405974}
      .stage {font-size:17px;font-weight:680;fill:#245994}
      .verb {font-size:16px;font-weight:550;fill:#405974}
      .wire {fill:none;stroke:#526e88;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect x="1" y="1" width="478" height="528" rx="16" fill="#f8fafc" stroke="#d7e0ea" stroke-width="1.5"/>
  <text x="24" y="39" class="stage" text-anchor="start">등록 전 · 중복 질문 검수</text>
  <path d="M226 33H456" stroke="#d7e0ea" stroke-width="1.3"/>
  <rect x="24" y="58" width="184" height="57" rx="10" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.4"/>
  <text x="116" y="93.5" class="node" text-anchor="middle" fill="#162c46">새 질문</text>
  <rect x="272" y="58" width="184" height="57" rx="10" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.4"/>
  <text x="364" y="93.5" class="node" text-anchor="middle" fill="#162c46">기존 질문</text>
  <path d="M116 116V130H364V116" class="wire"/>
  <path d="M240 130V151" class="wire" marker-end="url(#arrow)"/>
  <rect x="52" y="154" width="376" height="70" rx="10" fill="#e8f1fb" stroke="#a6c3de" stroke-width="1.4"/>
  <text x="240" y="185" class="node" text-anchor="middle" fill="#234f80">임베딩 유사도 검색</text>
  <text x="240" y="210" class="sub" text-anchor="middle">표현이 달라도 뜻이 가까운 질문을 찾음</text>
  <path d="M240 225V245" class="wire" marker-end="url(#arrow)"/>
  <rect x="52" y="248" width="376" height="52" rx="10" fill="#e6f4f0" stroke="#a3cbc0" stroke-width="1.4"/>
  <text x="240" y="281" class="node" text-anchor="middle" fill="#155d56">편집자가 등록 전 후보 비교</text>
  <text x="24" y="350" class="stage" text-anchor="start">등록 후 · 질문 품질 평가</text>
  <path d="M226 344H456" stroke="#d7e0ea" stroke-width="1.3"/>
  <rect x="24" y="370" width="205" height="77" rx="10" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.4"/>
  <text x="126.5" y="404.5" class="node" text-anchor="middle" fill="#162c46">질문 그룹</text>
  <text x="126.5" y="429.5" class="sub" text-anchor="middle">의미·의도 태그로 연결</text>
  <rect x="251" y="370" width="205" height="77" rx="10" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.4"/>
  <text x="353.5" y="404.5" class="node" text-anchor="middle" fill="#162c46">실제 응답률</text>
  <text x="353.5" y="429.5" class="sub" text-anchor="middle">사용자의 질문 응답 기록</text>
  <path d="M126 448V460H354V448" class="wire"/>
  <path d="M240 460V474" class="wire" marker-end="url(#arrow)"/>
  <rect x="52" y="477" width="376" height="37" rx="10" fill="#e6f4f0" stroke="#a3cbc0" stroke-width="1.4"/>
  <text x="240" y="502.5" class="node" text-anchor="middle" fill="#155d56" style="font-size:20px">질문 그룹별 응답률 비교</text>
</svg>
