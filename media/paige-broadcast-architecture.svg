  <text x="121" y="551" font-size="16.5" font-weight="450" fill="#70542f" text-anchor="middle">실제 경기 순서로 재생</text>
  <path class="edge" d="M219 532h30" marker-end="url(#arrow)"/>
  <rect x="254" y="495" width="202" height="73" rx="10" fill="#fcf2df" stroke="#dac79d" stroke-width="1.2" />
  <text x="355" y="526" font-size="20" font-weight="650" fill="#162c46" text-anchor="middle">오류 재현</text>
  <text x="355" y="551" font-size="16.5" font-weight="450" fill="#70542f" text-anchor="middle">이닝 종료 처리 누락</text>
</svg>
