  <text x="353.5" y="384" font-size="20" font-weight="700" fill="#164d48" text-anchor="middle">운영 어드민</text>
  <text x="353.5" y="407" font-size="17" font-weight="450" fill="#345e57" text-anchor="middle">처리 상태 확인</text>
  <path d="M24 447h432" stroke="#c6d3e0" stroke-width="1.2"/>
  <text x="25" y="478" font-size="18" font-weight="700" fill="#845823" text-anchor="start">테스트 환경</text>
