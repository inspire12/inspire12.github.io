<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 575" role="img" aria-labelledby="title description" xml:lang="ko">
  <title id="title">Vision 모델의 배포와 서비스 호출</title>
  <desc id="description">Vision AI 팀 모델의 버전을 관리하고 모델 추론을 제공하는 FastAPI 서버를 컨테이너로 만듭니다. CI/CD로 GPU 기반 Kubernetes에 빌드·배포합니다. 선수 분석 영상 서비스가 실행 중인 API를 호출하고 추론 결과를 받습니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#526e88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text {font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif}
      .node {font-size:21px;font-weight:680}
      .sub {font-size:17px;font-weight:450;fill:#405974}
      .stage {font-size:17px;font-weight:680;fill:#245994}
      .verb {font-size:16px;font-weight:550;fill:#405974}
      .wire {fill:none;stroke:#526e88;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect x="1" y="1" width="478" height="573" rx="16" fill="#f8fafc" stroke="#d7e0ea" stroke-width="1.5"/>
  <text x="24" y="39" class="stage" text-anchor="start">모델 서빙과 자동 배포</text>
  <path d="M218 33H456" stroke="#d7e0ea" stroke-width="1.3"/>
  <rect x="45" y="57" width="390" height="65" rx="10" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.4"/>
  <text x="240" y="85.5" class="node" text-anchor="middle" fill="#162c46">Vision AI 모델</text>
  <text x="240" y="110.5" class="sub" text-anchor="middle">모델 버전 관리</text>
  <path d="M240 123V144" class="wire" marker-end="url(#arrow)"/>
  <rect x="45" y="147" width="390" height="69" rx="10" fill="#e8f1fb" stroke="#a6c3de" stroke-width="1.4"/>
  <text x="240" y="177.5" class="node" text-anchor="middle" fill="#234f80">FastAPI 서버</text>
  <text x="240" y="202.5" class="sub" text-anchor="middle">모델을 호출하는 API 구현 · 컨테이너화</text>
  <path d="M240 217V241" class="wire" marker-end="url(#arrow)"/>
  <rect x="45" y="244" width="390" height="52" rx="10" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.4"/>
  <text x="240" y="277" class="node" text-anchor="middle" fill="#162c46">CI/CD 파이프라인</text>
  <path d="M240 297V337" class="wire" marker-end="url(#arrow)"/>
  <text x="254" y="323" class="verb" text-anchor="start">빌드와 배포</text>
  <rect x="45" y="340" width="390" height="73" rx="10" fill="#e6f4f0" stroke="#a3cbc0" stroke-width="1.4"/>
  <text x="240" y="372.5" class="node" text-anchor="middle" fill="#155d56">GPU 기반 Kubernetes</text>
  <text x="240" y="397.5" class="sub" text-anchor="middle">모델 추론 API 실행</text>
  <path d="M153 478V416" class="wire" marker-end="url(#arrow)"/>
  <text x="141" y="452" class="verb" text-anchor="end">API 호출</text>
  <path d="M327 415V476" class="wire" marker-end="url(#arrow)"/>
  <text x="338" y="452" class="verb" text-anchor="start">추론 결과</text>
  <rect x="45" y="481" width="390" height="70" rx="10" fill="#ffffff" stroke="#c9d6e2" stroke-width="1.4"/>
  <text x="240" y="512" class="node" text-anchor="middle" fill="#162c46">선수 분석 영상 서비스</text>
  <text x="240" y="537" class="sub" text-anchor="middle">실시간 분석에 모델 결과 사용</text>
</svg>
